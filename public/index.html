<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LaporApp — Laporan Gangguan</title>
<style>
:root{
  --primary:#1E40AF;--primary-dark:#0F172A;
  --bg:#fff;--bg-soft:#F8FAFC;
  --text:#0F172A;--text-muted:#64748B;--border:#E2E8F0;
  --waiting:#EAB308;--process:#F59E0B;--done:#10B981;--danger:#EF4444;
  --radius:14px;--shadow:0 8px 24px rgba(15,23,42,.08);
  --t-fast:180ms cubic-bezier(.4,0,.2,1);--t-smooth:320ms cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg-soft);color:var(--text);min-height:100vh}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font:inherit}
a{color:inherit}

/* ==================== ANIMATIONS ==================== */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pulseWaiting{0%,100%{box-shadow:0 0 0 0 rgba(234,179,8,.5)}50%{box-shadow:0 0 0 8px rgba(234,179,8,0)}}
@keyframes modalIn{from{opacity:0;transform:scale(.9) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes bubbleIn{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes toastIn{from{opacity:0;transform:translateX(120%)}to{opacity:1;transform:translateX(0)}}
@keyframes bounceDot{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}

/* ==================== LAYOUT ==================== */
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#0F172A,#1E40AF);animation:fadeIn var(--t-smooth)}
.auth-card{width:100%;max-width:400px;background:#fff;border-radius:var(--radius);padding:32px;box-shadow:0 24px 48px rgba(0,0,0,.2);animation:fadeUp var(--t-smooth) both}
.auth-card h1{font-size:24px;margin-bottom:8px;color:var(--primary-dark)}
.auth-card p.sub{color:var(--text-muted);font-size:14px;margin-bottom:24px}

.app-nav{background:#fff;border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;animation:fadeIn var(--t-smooth)}
.app-nav .brand{font-weight:700;color:var(--primary);font-size:18px}
.app-nav nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.app-nav nav a{color:var(--text-muted);text-decoration:none;padding:8px 12px;border-radius:8px;font-size:14px;transition:all var(--t-fast)}
.app-nav nav a:hover{background:var(--bg-soft);color:var(--primary)}
.app-nav nav a.active{background:var(--primary);color:#fff}

.container{max-width:1100px;margin:0 auto;padding:32px 24px}
.page-title{font-size:24px;margin-bottom:20px;color:var(--primary-dark)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.grid--cards{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.two-col{grid-template-columns:1fr 1fr}

/* ==================== COMPONENTS ==================== */
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;background:#fff;transition:all var(--t-fast)}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(30,64,175,.1)}
.field textarea{resize:vertical;min-height:100px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;background:var(--primary);color:#fff;border-radius:10px;font-weight:600;font-size:14px;transition:all var(--t-fast);text-decoration:none}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 20px rgba(30,64,175,.25)}
.btn:active{transform:scale(.97)}
.btn--ghost{background:transparent;color:var(--primary);border:1.5px solid var(--primary)}
.btn--ghost:hover{background:var(--primary);color:#fff}
.btn--block{width:100%}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none!important}

.card{background:#fff;border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);border:1px solid var(--border);transition:all var(--t-fast);animation:fadeUp var(--t-smooth) both}
.card:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(15,23,42,.12)}
.card h3{font-size:16px;margin-bottom:8px}
.card .meta{color:var(--text-muted);font-size:13px;margin-bottom:8px}
.card .desc{color:var(--text);font-size:14px;line-height:1.5}
.card:nth-child(1){animation-delay:0ms}.card:nth-child(2){animation-delay:60ms}.card:nth-child(3){animation-delay:120ms}.card:nth-child(4){animation-delay:180ms}.card:nth-child(5){animation-delay:240ms}

.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#fff}
.badge--MENUNGGU{background:var(--waiting);animation:pulseWaiting 2s infinite}
.badge--DIPROSES{background:var(--process)}
.badge--SELESAI{background:var(--done)}

.link{color:var(--primary);text-decoration:none;font-weight:600;font-size:14px}
.link:hover{text-decoration:underline}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:24px}
.stat{background:#fff;padding:20px;border-radius:var(--radius);border:1px solid var(--border);text-align:center;animation:fadeUp var(--t-smooth) both}
.stat b{display:block;font-size:32px;color:var(--primary);margin-bottom:4px}
.stat span{color:var(--text-muted);font-size:13px}

.search{position:relative;margin-bottom:20px}
.search input{width:100%;padding:14px 18px 14px 44px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;transition:all var(--t-fast)}
.search input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(30,64,175,.1)}
.search::before{content:"🔍";position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:16px}

.empty{text-align:center;padding:60px 20px;color:var(--text-muted)}
.empty h3{font-size:18px;margin-bottom:8px;color:var(--text)}

/* ==================== CHAT ==================== */
.chat{background:#fff;border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;display:flex;flex-direction:column;height:420px;animation:fadeUp var(--t-smooth) both}
.chat__head{padding:14px 18px;border-bottom:1px solid var(--border);font-weight:600;font-size:14px;background:var(--bg-soft)}
.chat__body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.chat__foot{padding:12px;border-top:1px solid var(--border);display:flex;gap:8px}
.chat__foot input{flex:1;padding:10px 14px;border:1.5px solid var(--border);border-radius:20px;font-size:14px}
.chat__foot input:focus{outline:none;border-color:var(--primary)}
.chat__foot button{padding:10px 18px;background:var(--primary);color:#fff;border-radius:20px;font-weight:600;font-size:13px}
.bubble{max-width:75%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.4;animation:bubbleIn var(--t-fast) both;word-wrap:break-word}
.bubble--me{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.bubble--them{align-self:flex-start;background:var(--bg-soft);color:var(--text);border-bottom-left-radius:4px}
.bubble__time{font-size:10px;opacity:.7;margin-top:4px;display:block}

/* ==================== MODAL & TOAST ==================== */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.6);display:grid;place-items:center;padding:24px;z-index:100;animation:fadeIn var(--t-fast) both}
.modal__panel{background:#fff;border-radius:var(--radius);width:100%;max-width:440px;padding:24px;animation:modalIn var(--t-smooth) both;max-height:90vh;overflow-y:auto}
.modal__head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal__head h2{font-size:18px}
.modal__close{font-size:24px;color:var(--text-muted);padding:0;width:32px;height:32px;border-radius:8px;transition:background var(--t-fast)}
.modal__close:hover{background:var(--bg-soft)}

#toast-container{position:fixed;top:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 18px;border-radius:10px;background:#fff;color:var(--text);box-shadow:0 8px 24px rgba(0,0,0,.15);font-size:14px;font-weight:500;border-left:4px solid var(--primary);animation:toastIn var(--t-smooth) both;min-width:240px;max-width:360px}
.toast--success{border-color:var(--done)}
.toast--error{border-color:var(--danger)}

.dots{display:inline-flex;gap:4px;align-items:center}
.dots span{width:6px;height:6px;border-radius:50%;background:#fff;animation:bounceDot 1.2s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}

@media(max-width:700px){
  .container{padding:20px 16px}
  .auth-card{padding:24px}
  .app-nav{padding:12px 16px}
  .two-col{grid-template-columns:1fr!important}
  .page-title{font-size:20px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-container"></div>
<div id="modal-root"></div>

<script type="module">
/* =====================================================
   STATE
   ===================================================== */
const state = { user: null };

/* =====================================================
   API HELPER
   ===================================================== */
async function api(path, opts = {}) {
  const res = await fetch('/api' + path, {
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    method: opts.method || (opts.body ? 'POST' : 'GET'),
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Request gagal');
  return data;
}

/* =====================================================
   MOTION HELPERS
   ===================================================== */
function toast(msg, type = 'success') {
  const el = document.createElement('div');
  el.className = `toast toast--${type}`;
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => {
    el.style.opacity = 0;
    el.style.transition = 'opacity .3s';
    setTimeout(() => el.remove(), 300);
  }, 3000);
}

function openModal(html) {
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal"><div class="modal__panel">${html}</div></div>`;
  const m = root.querySelector('.modal');
  m.addEventListener('click', (e) => { if (e.target === m) closeModal(); });
  root.querySelectorAll('.modal__close').forEach(b => b.onclick = closeModal);
}
function closeModal() { document.getElementById('modal-root').innerHTML = ''; }

/* =====================================================
   ROUTER (hash-based SPA)
   ===================================================== */
const routes = {};

async function navigate() {
  const hash = location.hash.slice(1) || '/login';
  const [path, qs] = hash.split('?');
  const query = Object.fromEntries(new URLSearchParams(qs || ''));

  const isPublic = path === '/login' || path === '/register';
  const isAdmin  = path.startsWith('/admin');

  if (!state.user && !isPublic) return location.hash = '#/login';
  if (state.user && isPublic) {
    return location.hash = state.user.role === 'ADMIN' ? '#/admin/reports' : '#/dashboard';
  }
  if (isAdmin && state.user?.role !== 'ADMIN') return location.hash = '#/dashboard';

  const view = routes[path];
  if (!view) { location.hash = '#/login'; return; }

  try {
    document.getElementById('app').innerHTML = await view(query);
  } catch (err) {
    toast(err.message, 'error');
    location.hash = '#/login';
  }
}
window.addEventListener('hashchange', navigate);

/* =====================================================
   SHARED COMPONENTS
   ===================================================== */
function nav(active) {
  const u = state.user;
  if (!u) return '';
  const items = u.role === 'ADMIN' ? [
    ['/admin/reports', 'Laporan'],
    ['/admin/users',   'Kelola Admin'],
    ['/admin/support', 'Pesan Lupa'],
  ] : [['/dashboard', 'Laporan Saya']];

  setTimeout(() => {
    document.getElementById('logoutBtn')?.addEventListener('click', async (e) => {
      e.preventDefault();
      await api('/auth?action=logout', { method: 'POST' });
      state.user = null;
      location.hash = '#/login';
      toast('Berhasil logout');
    });
  });

  return `
    <nav class="app-nav">
      <div class="brand">📋 LaporApp</div>
      <nav>
        ${items.map(([p, l]) => `<a href="#${p}" class="${active === p ? 'active' : ''}">${l}</a>`).join('')}
        <a href="#" id="logoutBtn" style="color:var(--danger)">Logout (${u.username})</a>
      </nav>
    </nav>`;
}

/* =====================================================
   VIEW: LOGIN
   ===================================================== */
routes['/login'] = async () => {
  setTimeout(() => {
    document.getElementById('loginForm').onsubmit = async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button[type=submit]');
      btn.disabled = true;
      btn.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';
      try {
        const data = await api('/auth?action=login', { body: {
          username: document.getElementById('luser').value,
          password: document.getElementById('lpass').value,
        }});
        state.user = data.user;
        toast('Selamat datang, ' + data.user.username);
        location.hash = data.user.role === 'ADMIN' ? '#/admin/reports' : '#/dashboard';
      } catch (err) {
        toast(err.message, 'error');
        btn.disabled = false; btn.textContent = 'Masuk';
      }
    };
    document.getElementById('forgotBtn').onclick = () => {
      openModal(`
        <div class="modal__head"><h2>Lupa Password / Username</h2><button class="modal__close">×</button></div>
        <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px">Pesan Anda akan diteruskan ke admin.</p>
        <div class="field"><label>Username Anda</label><input id="fUser" placeholder="username" required></div>
        <div class="field"><label>Pesan</label><textarea id="fMsg" placeholder="Saya lupa password akun saya..." required></textarea></div>
        <button class="btn btn--block" id="fSend">Kirim ke Admin</button>
      `);
      document.getElementById('fSend').onclick = async () => {
        const u = document.getElementById('fUser').value.trim();
        const m = document.getElementById('fMsg').value.trim();
        if (!u || !m) return toast('Lengkapi data', 'error');
        try {
          await api('/messages', { body: { guestUsername: u, content: m, reportId: null, type: 'forgot' } });
          closeModal();
          toast('Pesan terkirim. Admin akan menghubungi Anda.');
        } catch (err) { toast(err.message, 'error'); }
      };
    };
  });

  return `
    <div class="auth-wrap"><div class="auth-card">
      <h1>Masuk</h1>
      <p class="sub">Laporkan gangguan alat dengan mudah</p>
      <form id="loginForm">
        <div class="field"><label>Username</label><input id="luser" required autofocus></div>
        <div class="field"><label>Password</label><input id="lpass" type="password" required></div>
        <button class="btn btn--block" type="submit">Masuk</button>
      </form>
      <p style="text-align:center;margin-top:16px;font-size:13px;color:var(--text-muted)">
        Belum punya akun? <a href="#/register" class="link">Daftar</a>
      </p>
      <p style="text-align:center;margin-top:8px">
        <button class="link" id="forgotBtn" style="background:none;padding:0">Lupa password / username?</button>
      </p>
    </div></div>`;
};

/* =====================================================
   VIEW: REGISTER
   ===================================================== */
routes['/register'] = async () => {
  setTimeout(() => {
    document.getElementById('regForm').onsubmit = async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button[type=submit]');
      btn.disabled = true; btn.textContent = 'Memproses...';
      try {
        await api('/auth?action=register', { body: {
          email:    document.getElementById('remail').value,
          username: document.getElementById('ruser').value,
          password: document.getElementById('rpass').value,
        }});
        toast('Registrasi berhasil, silakan login');
        location.hash = '#/login';
      } catch (err) {
        toast(err.message, 'error');
        btn.disabled = false; btn.textContent = 'Daftar';
      }
    };
  });

  return `
    <div class="auth-wrap"><div class="auth-card">
      <h1>Daftar Akun</h1>
      <p class="sub">Buat akun pelapor</p>
      <form id="regForm">
        <div class="field"><label>Email</label><input id="remail" type="email" required></div>
        <div class="field"><label>Username</label><input id="ruser" required minlength="3"></div>
        <div class="field"><label>Password</label><input id="rpass" type="password" required minlength="6"></div>
        <button class="btn btn--block" type="submit">Daftar</button>
      </form>
      <p style="text-align:center;margin-top:16px;font-size:13px;color:var(--text-muted)">
        Sudah punya akun? <a href="#/login" class="link">Masuk</a>
      </p>
    </div></div>`;
};

/* =====================================================
   VIEW: DASHBOARD (USER)
   ===================================================== */
routes['/dashboard'] = async () => {
  const reports = await api('/reports');
  const cards = reports.length ? reports.map(r => `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:8px;gap:8px">
        <h3>${escapeHtml(r.location)}</h3>
        <span class="badge badge--${r.status}">${r.status}</span>
      </div>
      <div class="meta">${escapeHtml(r.reporter_name)} • ${new Date(r.created_at).toLocaleDateString('id-ID')}</div>
      <div class="desc">${escapeHtml(r.description).slice(0,120)}${r.description.length > 120 ? '…' : ''}</div>
      <div style="margin-top:12px"><a href="#/report?id=${r.id}" class="link">Detail & Chat →</a></div>
    </div>
  `).join('') : `<div class="empty"><h3>Belum ada laporan</h3><p>Klik "Buat Laporan" untuk mulai.</p></div>`;

  return `${nav('/dashboard')}<div class="container">
    <div class="row">
      <h2 class="page-title">Laporan Saya</h2>
      <a href="#/create" class="btn">+ Buat Laporan</a>
    </div>
    <div class="grid grid--cards">${cards}</div>
  </div>`;
};

/* =====================================================
   VIEW: CREATE REPORT
   ===================================================== */
routes['/create'] = async () => {
  setTimeout(() => {
    document.getElementById('createForm').onsubmit = async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button[type=submit]');
      btn.disabled = true; btn.textContent = 'Mengirim...';
      try {
        await api('/reports', { body: {
          reporterName: document.getElementById('cname').value,
          location:     document.getElementById('cloc').value,
          description:  document.getElementById('cdesc').value,
        }});
        toast('Laporan dibuat');
        location.hash = '#/dashboard';
      } catch (err) {
        toast(err.message, 'error');
        btn.disabled = false; btn.textContent = 'Kirim Laporan';
      }
    };
  });

  return `${nav('/dashboard')}<div class="container" style="max-width:640px">
    <h2 class="page-title">Buat Laporan Baru</h2>
    <div class="card" style="padding:28px">
      <form id="createForm">
        <div class="field"><label>Nama Pelapor</label><input id="cname" value="${escapeHtml(state.user.username)}" required></div>
        <div class="field"><label>Tempat</label><input id="cloc" placeholder="Contoh: Ruang Server Lt. 2" required></div>
        <div class="field"><label>Apa yang Dilaporkan</label><textarea id="cdesc" placeholder="Jelaskan gangguan..." required></textarea></div>
        <div style="display:flex;gap:8px">
          <a href="#/dashboard" class="btn btn--ghost">Batal</a>
          <button type="submit" class="btn" style="flex:1">Kirim Laporan</button>
        </div>
      </form>
    </div>
  </div>`;
};

/* =====================================================
   VIEW: REPORT DETAIL (USER)
   ===================================================== */
routes['/report'] = async (q) => {
  const report = await api('/reports?id=' + q.id);
  setTimeout(() => mountChat(q.id, report.user_id));

  return `${nav('/dashboard')}<div class="container">
    <a href="#/dashboard" class="link">← Kembali</a>
    <div class="grid two-col" style="margin-top:16px">
      <div class="card" style="padding:24px">
        <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:12px;gap:8px">
          <h2>${escapeHtml(report.location)}</h2>
          <span class="badge badge--${report.status}">${report.status}</span>
        </div>
        <p class="meta" style="margin-bottom:16px">${escapeHtml(report.reporter_name)} • ${new Date(report.created_at).toLocaleString('id-ID')}</p>
        <p class="desc">${escapeHtml(report.description)}</p>
      </div>
      <div class="chat">
        <div class="chat__head">💬 Chat dengan Admin</div>
        <div class="chat__body" id="chatBody"></div>
        <form class="chat__foot" id="chatForm">
          <input id="chatInput" placeholder="Tulis pesan..." autocomplete="off">
          <button type="submit">Kirim</button>
        </form>
      </div>
    </div>
  </div>`;
};

/* =====================================================
   VIEW: ADMIN — REPORTS
   ===================================================== */
routes['/admin/reports'] = async () => {
  const all = await api('/reports?all=1');
  const counts = {
    menunggu: all.filter(r => r.status === 'MENUNGGU').length,
    proses:   all.filter(r => r.status === 'DIPROSES').length,
    selesai:  all.filter(r => r.status === 'SELESAI').length,
  };

  setTimeout(() => {
    const draw = (filter = '') => {
      const f = filter.toLowerCase();
      const list = all.filter(r =>
        !f || r.reporter_name.toLowerCase().includes(f) ||
        r.location.toLowerCase().includes(f) ||
        r.description.toLowerCase().includes(f)
      );
      document.getElementById('reportList').innerHTML = list.length ? list.map(r => `
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:8px;gap:8px">
            <h3>${escapeHtml(r.location)}</h3>
            <span class="badge badge--${r.status}">${r.status}</span>
          </div>
          <div class="meta">${escapeHtml(r.reporter_name)} • ${new Date(r.created_at).toLocaleDateString('id-ID')}</div>
          <div class="desc">${escapeHtml(r.description).slice(0,100)}${r.description.length > 100 ? '…' : ''}</div>
          <div style="margin-top:12px"><a href="#/admin/report?id=${r.id}" class="link">Kelola →</a></div>
        </div>
      `).join('') : `<div class="empty"><h3>Tidak ada hasil</h3></div>`;
    };
    document.getElementById('searchInput').oninput = (e) => draw(e.target.value);
    draw();
  });

  return `${nav('/admin/reports')}<div class="container">
    <h2 class="page-title">Semua Laporan</h2>
    <div class="stats">
      <div class="stat"><b>${counts.menunggu}</b><span>Menunggu</span></div>
      <div class="stat"><b>${counts.proses}</b><span>Diproses</span></div>
      <div class="stat"><b>${counts.selesai}</b><span>Selesai</span></div>
    </div>
    <div class="search"><input id="searchInput" placeholder="Cari nama pelapor, tempat, atau deskripsi..."></div>
    <div class="grid grid--cards" id="reportList"></div>
  </div>`;
};

/* =====================================================
   VIEW: ADMIN — REPORT DETAIL
   ===================================================== */
routes['/admin/report'] = async (q) => {
  const report = await api('/reports?id=' + q.id);
  setTimeout(() => {
    mountChat(q.id, report.user_id);
    document.getElementById('updateBtn').onclick = async () => {
      const status = document.getElementById('statusSel').value;
      try {
        await api('/reports', { method: 'PATCH', body: { id: q.id, status } });
        toast('Status diperbarui');
      } catch (err) { toast(err.message, 'error'); }
    };
  });
  const statuses = ['MENUNGGU', 'DIPROSES', 'SELESAI'];

  return `${nav('/admin/reports')}<div class="container">
    <a href="#/admin/reports" class="link">← Kembali</a>
    <div class="grid two-col" style="margin-top:16px">
      <div class="card" style="padding:24px">
        <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:12px;gap:8px">
          <h2>${escapeHtml(report.location)}</h2>
          <span class="badge badge--${report.status}">${report.status}</span>
        </div>
        <p class="meta" style="margin-bottom:16px">${escapeHtml(report.reporter_name)} • ${new Date(report.created_at).toLocaleString('id-ID')}</p>
        <p class="desc" style="margin-bottom:20px">${escapeHtml(report.description)}</p>
        <hr style="border:none;border-top:1px solid var(--border);margin:20px 0">
        <label style="font-size:13px;font-weight:600;display:block;margin-bottom:8px">Ubah Status</label>
        <div style="display:flex;gap:8px">
          <select id="statusSel" style="flex:1;padding:10px;border:1.5px solid var(--border);border-radius:10px">
            ${statuses.map(s => `<option value="${s}" ${s === report.status ? 'selected' : ''}>${s}</option>`).join('')}
          </select>
          <button class="btn" id="updateBtn">Simpan</button>
        </div>
      </div>
      <div class="chat">
        <div class="chat__head">💬 Chat dengan ${escapeHtml(report.reporter_name)}</div>
        <div class="chat__body" id="chatBody"></div>
        <form class="chat__foot" id="chatForm">
          <input id="chatInput" placeholder="Tulis pesan..." autocomplete="off">
          <button type="submit">Kirim</button>
        </form>
      </div>
    </div>
  </div>`;
};

/* =====================================================

   VIEW: ADMIN — SUPPORT INBOX

routes['/admin/support'] = async () => {
  const msgs = await api('/messages?inbox=forgot');
  const list = msgs.length ? msgs.map(m => `
    <div class="card">
      <div class="meta"><b>${escapeHtml(m.sender_username || 'guest')}</b> • ${new Date(m.created_at).toLocaleString('id-ID')}</div>

    <div class="grid grid--cards">${list}</div>

/* =====================================================
   CHAT COMPONENT (polling 3s)
   ===================================================== */
function mountChat(reportId) {
  const body = document.getElementById('chatBody');
  const form = document.getElementById('chatForm');
  if (!body || !form) return;
  let lastLen = -1;

  async function load() {
    try {
      const msgs = await api(`/messages?reportId=${reportId}`);
      if (msgs.length === lastLen) return;
      lastLen = msgs.length;
      body.innerHTML = msgs.map(m => {
        const mine = m.sender_id === state.user.id;
        return `<div class="bubble bubble--${mine ? 'me' : 'them'}">
          ${escapeHtml(m.content)}
          <span class="bubble__time">${new Date(m.created_at).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })}</span>
        </div>`;
      }).join('');
      body.scrollTop = body.scrollHeight;
    } catch {}
  }

  form.onsubmit = async (e) => {
    e.preventDefault();
    const input = document.getElementById('chatInput');
    const content = input.value.trim();
    if (!content) return;
    input.value = '';
    try {
      await api('/messages', { body: { reportId, content } });
      lastLen = -1;
      load();
    } catch (err) { toast(err.message, 'error'); }
  };

  load();
  setInterval(load, 3000);
}

/* =====================================================
   UTIL
   ===================================================== */
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

/* =====================================================
   INIT
   ===================================================== */
(async function init() {
  try {
    const data = await api('/auth?action=me');
    state.user = data.user;
  } catch { state.user = null; }

  if (!location.hash) {
    location.hash = state.user
      ? (state.user.role === 'ADMIN' ? '#/admin/reports' : '#/dashboard')
      : '#/login';
  }
  navigate();
})();
</script>
