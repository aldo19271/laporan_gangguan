<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>LaporApp — Sistem Laporan Gangguan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root {
  --primary: #1E40AF;
  --primary-hover: #1e3a8a;
  --bg-body: #F8FAFC;
  --bg-surface: #FFFFFF;
  --text-main: #0F172A;
  --text-muted: #64748B;
  --border: #E2E8F0;
  --waiting: #EAB308;
  --process: #F59E0B;
  --done: #10B981;
  --danger: #EF4444;
  --radius: 10px;
  --shadow-sm: 0 1px 3px rgba(15,23,42,.05);
  --shadow-md: 0 4px 12px rgba(15,23,42,.08);
  --sidebar-w: 260px;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
body { background: var(--bg-body); color: var(--text-main); min-height: 100vh; overflow-x: hidden; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea, select { font-family: inherit; }
a { color: inherit; text-decoration: none; }

/* ANIMATIONS */
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideInLeft { from { transform: translateX(-100%); } to { transform: translateX(0); } }
@keyframes growWidth { from { width: 0; } }
.animate-fade { animation: fadeIn 0.3s ease; }
.animate-slide { animation: slideUp 0.3s ease; }

/* AUTH PAGES (Login/Register) */
.auth-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg-body); }
.auth-card { width: 100%; max-width: 400px; background: var(--bg-surface); border-radius: var(--radius); padding: 36px; box-shadow: var(--shadow-md); border: 1px solid var(--border); animation: slideUp 0.4s ease; }
.auth-card h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.5px; }
.auth-card p.sub { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }

/* LAYOUT: SIDEBAR & MAIN */
.app-layout { display: flex; min-height: 100vh; }
.sidebar { width: var(--sidebar-w); background: var(--bg-surface); border-right: 1px solid var(--border); position: fixed; top: 0; bottom: 0; left: 0; z-index: 50; display: flex; flex-direction: column; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
.sidebar-header { padding: 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 18px; color: var(--primary); }
.sidebar-nav { padding: 16px; flex: 1; display: flex; flex-direction: column; gap: 4px; }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 8px; color: var(--text-muted); font-weight: 500; font-size: 14px; transition: all 0.2s; }
.nav-item:hover { background: var(--bg-body); color: var(--text-main); }
.nav-item.active { background: #EFF6FF; color: var(--primary); font-weight: 600; }
.nav-item svg { width: 18px; height: 18px; }
.sidebar-footer { padding: 16px; border-top: 1px solid var(--border); }

.main-content { flex: 1; margin-left: var(--sidebar-w); display: flex; flex-direction: column; min-height: 100vh; }
.topbar { height: 64px; background: var(--bg-surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 24px; gap: 16px; position: sticky; top: 0; z-index: 40; }
.hamburger { display: none; padding: 8px; border-radius: 8px; background: var(--bg-body); }
.content-area { padding: 32px; max-width: 1200px; margin: 0 auto; width: 100%; }
.overlay { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.4); z-index: 45; backdrop-filter: blur(2px); animation: fadeIn 0.2s; }

/* COMPONENTS */
.field { margin-bottom: 20px; }
.field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: var(--text-main); }
.field input, .field textarea, .field select { width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; background: var(--bg-surface); transition: all 0.2s; color: var(--text-main); }
.field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(30,64,175,0.1); }
.field textarea { resize: vertical; min-height: 120px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 20px; background: var(--primary); color: #fff; border-radius: 8px; font-weight: 600; font-size: 14px; transition: all 0.2s; }
.btn:hover { background: var(--primary-hover); }
.btn--ghost { background: transparent; color: var(--text-main); border: 1px solid var(--border); }
.btn--ghost:hover { background: var(--bg-body); }
.btn--danger { background: #FEF2F2; color: var(--danger); border: 1px solid #FECACA; }
.btn--danger:hover { background: #FEE2E2; }
.btn--block { width: 100%; }
.btn:disabled { opacity: 0.6; cursor: not-allowed; }
.btn-icon { padding: 8px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; color: var(--text-muted); transition: 0.2s; background: var(--bg-surface); border: 1px solid var(--border); }
.btn-icon:hover { background: var(--bg-body); color: var(--text-main); }
.btn-icon--danger:hover { background: #FEF2F2; color: var(--danger); border-color: #FECACA; }

.card { background: var(--bg-surface); border-radius: var(--radius); padding: 24px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
.grid { display: grid; gap: 20px; }
.grid-cards { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }

/* ANALYTICS BAR */
.analytics-card { margin-bottom: 24px; }
.analytics-header { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 14px; font-weight: 600; }
.analytics-bar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--bg-body); width: 100%; }
.bar-segment { height: 100%; transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); animation: growWidth 1s ease; }
.bar-waiting { background: var(--waiting); }
.bar-process { background: var(--process); }
.bar-done { background: var(--done); }
.analytics-legend { display: flex; gap: 16px; margin-top: 16px; font-size: 13px; color: var(--text-muted); }
.legend-item { display: flex; align-items: center; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 50%; }

/* BADGES */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; }
.badge--MENUNGGU { background: #FEF9C3; color: #854D0E; }
.badge--DIPROSES { background: #FEF3C7; color: #92400E; }
.badge--SELESAI { background: #D1FAE5; color: #065F46; }

/* TABLES */
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-surface); }
table { width: 100%; border-collapse: collapse; text-align: left; }
th, td { padding: 16px; border-bottom: 1px solid var(--border); font-size: 14px; }
th { background: var(--bg-body); font-weight: 600; color: var(--text-muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
tr:last-child td { border-bottom: none; }

/* CHAT */
.chat { display: flex; flex-direction: column; height: 500px; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--bg-surface); }
.chat__head { padding: 16px; border-bottom: 1px solid var(--border); font-weight: 600; display: flex; align-items: center; gap: 8px; }
.chat__body { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; background: #FAFAFA; }
.chat__foot { padding: 16px; border-top: 1px solid var(--border); display: flex; gap: 12px; background: var(--bg-surface); }
.chat__foot input { flex: 1; padding: 12px 16px; border: 1px solid var(--border); border-radius: 24px; font-size: 14px; }
.chat__foot input:focus { outline: none; border-color: var(--primary); }
.bubble { max-width: 75%; padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.5; position: relative; animation: slideUp 0.2s ease; }
.bubble--me { align-self: flex-end; background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }
.bubble--them { align-self: flex-start; background: #fff; border: 1px solid var(--border); color: var(--text-main); border-bottom-left-radius: 4px; }
.bubble__time { font-size: 10px; opacity: 0.7; margin-top: 6px; display: block; text-align: right; }

/* MODAL & TOAST */
.modal { position: fixed; inset: 0; background: rgba(15,23,42,.5); display: grid; place-items: center; padding: 24px; z-index: 100; animation: fadeIn 0.2s; }
.modal__panel { background: var(--bg-surface); border-radius: var(--radius); width: 100%; max-width: 440px; padding: 32px; animation: slideUp 0.3s; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-md); }
.modal__head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
.modal__head h2 { font-size: 18px; font-weight: 700; }

#toast-container { position: fixed; top: 24px; right: 24px; z-index: 200; display: flex; flex-direction: column; gap: 12px; }
.toast { padding: 14px 20px; border-radius: 8px; background: var(--bg-surface); box-shadow: var(--shadow-md); font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 12px; border-left: 4px solid var(--primary); animation: slideUp 0.3s; }
.toast--success { border-color: var(--done); }
.toast--error { border-color: var(--danger); }

/* RESPONSIVE */
@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); animation: slideInLeft 0.3s; }
  .main-content { margin-left: 0; }
  .hamburger { display: block; }
  .overlay.show { display: block; }
  .content-area { padding: 20px; }
  .grid-cards { grid-template-columns: 1fr; }
  .two-col { grid-template-columns: 1fr !important; }
}
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-container"></div>
<div id="modal-root"></div>

<script type="module">
/* =====================================================
   STATE & API
   ===================================================== */
const state = { user: null };

async function api(path, opts = {}) {
  const res = await fetch('/api' + path, {
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    method: opts.method || (opts.body ? 'POST' : 'GET'),
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Request gagal');
  return data;
}

/* =====================================================
   UI HELPERS (Lucide & Toast & Modal)
   ===================================================== */
function refreshIcons() { setTimeout(() => { if (window.lucide) lucide.createIcons(); }, 50); }

function toast(msg, type = 'success') {
  const icons = { success: 'check-circle', error: 'alert-circle' };
  const el = document.createElement('div');
  el.className = `toast toast--${type}`;
  el.innerHTML = `<i data-lucide="${icons[type]}"></i> <span>${msg}</span>`;
  document.getElementById('toast-container').appendChild(el);
  refreshIcons();
  setTimeout(() => { el.style.opacity = 0; setTimeout(() => el.remove(), 300); }, 3000);
}

function openModal(html) {
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal"><div class="modal__panel">${html}</div></div>`;
  refreshIcons();
  const m = root.querySelector('.modal');
  m.addEventListener('click', (e) => { if (e.target === m) closeModal(); });
  root.querySelectorAll('.modal__close').forEach(b => b.onclick = closeModal);
}
function closeModal() { document.getElementById('modal-root').innerHTML = ''; }

function confirmDelete(text, onConfirm) {
  openModal(`
    <div class="modal__head"><h2>Konfirmasi Hapus</h2></div>
    <p style="color:var(--text-muted);font-size:14px;margin-bottom:24px;line-height:1.5">${text}</p>
    <div style="display:flex;gap:12px;justify-content:flex-end">
      <button class="btn btn--ghost" onclick="document.getElementById('modal-root').innerHTML=''">Batal</button>
      <button class="btn btn--danger" id="confirmBtn">Ya, Hapus</button>
    </div>
  `);
  document.getElementById('confirmBtn').onclick = async () => {
    closeModal();
    await onConfirm();
  };
}

/* =====================================================
   ROUTER
   ===================================================== */
const routes = {};

async function navigate() {
  const hash = location.hash.slice(1) || '/login';
  const [path, qs] = hash.split('?');
  const query = Object.fromEntries(new URLSearchParams(qs || ''));

  const isPublic = path === '/login' || path === '/register';
  const isAdmin = path.startsWith('/admin');

  if (!state.user && !isPublic) return location.hash = '#/login';
  if (state.user && isPublic) {
    return location.hash = state.user.role === 'ADMIN' ? '#/admin/reports' : '#/dashboard';
  }
  if (isAdmin && state.user?.role !== 'ADMIN') return location.hash = '#/dashboard';

  const view = routes[path];
  if (!view) { location.hash = '#/login'; return; }

  try {
    document.getElementById('app').innerHTML = await view(query);
    refreshIcons();
    // Tutup sidebar saat pindah halaman di mobile
    document.getElementById('sidebar')?.classList.remove('open');
    document.getElementById('overlay')?.classList.remove('show');
  } catch (err) {
    toast(err.message, 'error');
    if(err.message.includes('login') || err.message.includes('Akses')) location.hash = '#/login';
  }
}
window.addEventListener('hashchange', navigate);

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}

/* =====================================================
   SHARED LAYOUT (SIDEBAR)
   ===================================================== */
function appLayout(activePath, content) {
  const u = state.user;
  if (!u) return content;

  const menu = u.role === 'ADMIN' ? [
    ['/admin/reports', 'Laporan Masuk', 'clipboard-list'],
    ['/admin/users', 'Kelola Pengguna', 'users'],
    ['/admin/support', 'Pesan Lupa', 'message-square']
  ] : [
    ['/dashboard', 'Laporan Saya', 'clipboard-list']
  ];

  const navHtml = menu.map(([p, label, icon]) => `
    <a href="#${p}" class="nav-item ${activePath === p ? 'active' : ''}">
      <i data-lucide="${icon}"></i> ${label}
    </a>
  `).join('');

  // Timer to attach logout listener
  setTimeout(() => {
    document.getElementById('logoutBtn')?.addEventListener('click', async (e) => {
      e.preventDefault();
      await api('/auth?action=logout', { method: 'POST' });
      state.user = null;
      location.hash = '#/login';
      toast('Berhasil logout');
    });
  });

  return `
    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <i data-lucide="monitor-speaker" style="width:24px;height:24px;color:var(--primary)"></i>
        LaporApp
      </div>
      <div class="sidebar-nav">
        ${navHtml}
      </div>
      <div class="sidebar-footer">
        <a href="#" id="logoutBtn" class="nav-item" style="color:var(--danger)">
          <i data-lucide="log-out"></i> Keluar
        </a>
      </div>
    </div>
    <div class="main-content">
      <div class="topbar">
        <button class="hamburger" onclick="toggleSidebar()"><i data-lucide="menu"></i></button>
        <div style="font-weight:600;font-size:16px">Halo, ${u.username}</div>
      </div>
      <div class="content-area animate-fade">
        ${content}
      </div>
    </div>
  `;
}

/* =====================================================
   VIEW: LOGIN
   ===================================================== */
routes['/login'] = async () => {
  setTimeout(() => {
    document.getElementById('loginForm').onsubmit = async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button[type=submit]');
      btn.disabled = true; btn.innerHTML = 'Memproses...';
      try {
        const data = await api('/auth?action=login', { body: {
          username: document.getElementById('luser').value,
          password: document.getElementById('lpass').value,
        }});
        state.user = data.user;
        toast('Selamat datang');
        location.hash = data.user.role === 'ADMIN' ? '#/admin/reports' : '#/dashboard';
      } catch (err) {
        toast(err.message, 'error');
        btn.disabled = false; btn.innerHTML = 'Masuk';
      }
    };
    
    // Fitur Lupa Password dengan Email
    document.getElementById('forgotBtn').onclick = () => {
      openModal(`
        <div class="modal__head"><h2>Lupa Akun</h2><button class="modal__close"><i data-lucide="x"></i></button></div>
        <p style="font-size:13px;color:var(--text-muted);margin-bottom:20px">Pesan Anda akan diteruskan ke Admin untuk diverifikasi.</p>
        <div class="field"><label>Username</label><input id="fUser" placeholder="username" required></div>
        <div class="field"><label>Email (Gmail)</label><input id="fEmail" type="email" placeholder="email@gmail.com" required></div>
        <div class="field"><label>Pesan / Kendala</label><textarea id="fMsg" placeholder="Saya lupa password..." required></textarea></div>
        <button class="btn btn--block" id="fSend">Kirim Pesan</button>
      `);
      document.getElementById('fSend').onclick = async () => {
        const u = document.getElementById('fUser').value.trim();
        const em = document.getElementById('fEmail').value.trim();
        const m = document.getElementById('fMsg').value.trim();
        if (!u || !em || !m) return toast('Lengkapi semua data', 'error');
        try {
          await api('/messages', { body: { guestUsername: u, guestEmail: em, content: m, type: 'forgot' } });
          closeModal();
          toast('Pesan terkirim ke Admin.');
        } catch (err) { toast(err.message, 'error'); }
      };
    };
  });

  return `
    <div class="auth-wrap"><div class="auth-card">
      <h1>Masuk ke LaporApp</h1>
      <p class="sub">Sistem pelaporan gangguan alat terpusat.</p>
      <form id="loginForm">
        <div class="field"><label>Username</label><input id="luser" required autofocus placeholder="Masukkan username"></div>
        <div class="field"><label>Password</label><input id="lpass" type="password" required placeholder="Masukkan password"></div>
        <button class="btn btn--block" type="submit">Masuk</button>
      </form>
      <div style="display:flex;justify-content:space-between;margin-top:20px;font-size:13px">
        <a href="#/register" style="color:var(--primary);font-weight:600">Daftar Akun</a>
        <button id="forgotBtn" style="color:var(--text-muted)">Lupa Password?</button>
      </div>
    </div></div>`;
};

/* =====================================================
   VIEW: REGISTER
   ===================================================== */
routes['/register'] = async () => {
  setTimeout(() => {
    document.getElementById('regForm').onsubmit = async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button[type=submit]');
      btn.disabled = true; btn.innerHTML = 'Memproses...';
      try {
        await api('/auth?action=register', { body: {
          email:    document.getElementById('remail').value,
          username: document.getElementById('ruser').value,
          password: document.getElementById('rpass').value,
        }});
        toast('Registrasi berhasil, silakan login');
        location.hash = '#/login';
      } catch (err) {
        toast(err.message, 'error');
        btn.disabled = false; btn.innerHTML = 'Daftar';
      }
    };
  });

  return `
    <div class="auth-wrap"><div class="auth-card">
      <h1>Buat Akun</h1>
      <p class="sub">Daftar untuk mulai membuat laporan.</p>
      <form id="regForm">
        <div class="field"><label>Email (Gmail)</label><input id="remail" type="email" required placeholder="email@gmail.com"></div>
        <div class="field"><label>Username</label><input id="ruser" required minlength="3" placeholder="minimal 3 karakter"></div>
        <div class="field"><label>Password</label><input id="rpass" type="password" required minlength="6" placeholder="minimal 6 karakter"></div>
        <button class="btn btn--block" type="submit">Daftar Sekarang</button>
      </form>
      <p style="text-align:center;margin-top:20px;font-size:13px;color:var(--text-muted)">
        Sudah punya akun? <a href="#/login" style="color:var(--primary);font-weight:600">Masuk</a>
      </p>
    </div></div>`;
};

/* =====================================================
   VIEW: DASHBOARD (USER)
   ===================================================== */
routes['/dashboard'] = async () => {
  const reports = await api('/reports');
  const cards = reports.length ? reports.map(r => `
    <div class="card animate-slide">
      <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:12px;gap:12px">
        <h3 style="font-size:16px;font-weight:600">${escapeHtml(r.location)}</h3>
        <span class="badge badge--${r.status}">${r.status}</span>
      </div>
      <div style="color:var(--text-muted);font-size:13px;margin-bottom:12px;display:flex;align-items:center;gap:6px">
        <i data-lucide="calendar" style="width:14px;height:14px"></i> ${new Date(r.created_at).toLocaleDateString('id-ID')}
      </div>
      <p style="font-size:14px;line-height:1.6;color:var(--text-main);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">
        ${escapeHtml(r.description)}
      </p>
      <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--border)">
        <a href="#/report?id=${r.id}" class="btn btn--ghost btn--block" style="padding:8px">Lihat Detail</a>
      </div>
    </div>
  `).join('') : `<div style="text-align:center;padding:60px 20px;color:var(--text-muted);grid-column:1/-1">
    <i data-lucide="inbox" style="width:48px;height:48px;margin-bottom:16px;opacity:0.5"></i>
    <h3 style="font-size:16px;color:var(--text-main);margin-bottom:8px">Belum ada laporan</h3>
    <p style="font-size:14px">Klik tombol di atas untuk membuat laporan baru.</p>
  </div>`;

  const content = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px">
      <h2 style="font-size:20px;font-weight:700">Laporan Saya</h2>
      <a href="#/create" class="btn"><i data-lucide="plus"></i> Buat Laporan</a>
    </div>
    <div class="grid grid-cards">${cards}</div>
  `;
  return appLayout('/dashboard', content);
};

/* =====================================================
   VIEW: CREATE REPORT
   ===================================================== */
routes['/create'] = async () => {
  setTimeout(() => {
    document.getElementById('createForm').onsubmit = async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button[type=submit]');
      btn.disabled = true; btn.innerHTML = 'Mengirim...';
      try {
        await api('/reports', { body: {
          reporterName: document.getElementById('cname').value,

/* =====================================================
   VIEW: ADMIN — REPORTS (Dengan Grafik Analisis)
   ===================================================== */
routes['/admin/reports'] = async () => {
  const all = await api('/reports?all=1');
  
  const countWait = all.filter(r => r.status === 'MENUNGGU').length;
  const countProcess = all.filter(r => r.status === 'DIPROSES').length;
  const countDone = all.filter(r => r.status === 'SELESAI').length;
  const total = all.length || 1; // hindari divide by zero

  const pctWait = (countWait / total) * 100;
  const pctProcess = (countProcess / total) * 100;
  const pctDone = (countDone / total) * 100;

  setTimeout(() => {
    const drawList = (filter = '') => {
      const f = filter.toLowerCase();
      const list = all.filter(r =>
        !f || r.reporter_name.toLowerCase().includes(f) ||
        r.location.toLowerCase().includes(f) ||
        r.description.toLowerCase().includes(f)
      );
      document.getElementById('reportList').innerHTML = list.length ? list.map(r => `
        <div class="card animate-slide">
          <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:12px;gap:12px">
            <h3 style="font-size:16px;font-weight:600">${escapeHtml(r.location)}</h3>
            <span class="badge badge--${r.status}">${r.status}</span>
          </div>
          <div style="color:var(--text-muted);font-size:13px;margin-bottom:12px;display:flex;align-items:center;gap:6px">
            <i data-lucide="user" style="width:14px;height:14px"></i> ${escapeHtml(r.reporter_name)}
          </div>
          <p style="font-size:14px;color:var(--text-main);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${escapeHtml(r.description)}</p>
          <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--border)">
            <a href="#/admin/report?id=${r.id}" class="btn btn--ghost btn--block" style="padding:8px">Kelola Laporan</a>
          </div>
        </div>
      `).join('') : `<div style="text-align:center;padding:60px 20px;color:var(--text-muted);grid-column:1/-1">
        <i data-lucide="search-x" style="width:48px;height:48px;margin-bottom:16px;opacity:0.5"></i>
        <h3 style="font-size:16px;color:var(--text-main)">Tidak ada hasil</h3>
      </div>`;
      refreshIcons();
    };
    document.getElementById('searchInput').oninput = (e) => drawList(e.target.value);
    drawList();
  });

  const content = `
    <h2 style="font-size:20px;font-weight:700;margin-bottom:24px">Ringkasan Laporan</h2>
    
    <div class="card analytics-card">
      <div class="analytics-header">
        <span>Total: ${all.length} Laporan</span>
        <span>${Math.round(pctDone)}% Selesai</span>
      </div>
      <div class="analytics-bar">
        <div class="bar-segment bar-waiting" style="width: ${pctWait}%" title="Menunggu: ${countWait}"></div>
        <div class="bar-segment bar-process" style="width: ${pctProcess}%" title="Diproses: ${countProcess}"></div>
        <div class="bar-segment bar-done" style="width: ${pctDone}%" title="Selesai: ${countDone}"></div>
      </div>
      <div class="analytics-legend">
        <div class="legend-item"><div class="dot" style="background:var(--waiting)"></div> Menunggu (${countWait})</div>
        <div class="legend-item"><div class="dot" style="background:var(--process)"></div> Diproses (${countProcess})</div>
        <div class="legend-item"><div class="dot" style="background:var(--done)"></div> Selesai (${countDone})</div>
      </div>
    </div>

    <div class="field" style="margin-bottom:24px; position:relative">
      <i data-lucide="search" style="position:absolute;left:16px;top:14px;color:var(--text-muted);width:18px"></i>
      <input id="searchInput" placeholder="Cari nama, tempat, atau deskripsi..." style="padding-left:48px;border-radius:24px">
    </div>
    
    <div class="grid grid-cards" id="reportList"></div>
  `;
  return appLayout('/admin/reports', content);
};

/* =====================================================
   CHAT COMPONENT (polling 3s)
   ===================================================== */
function mountChat(reportId) {
  const body = document.getElementById('chatBody');
  const form = document.getElementById('chatForm');
  if (!body || !form) return;
  let lastLen = -1;

  async function load() {
    try {
      const msgs = await api(`/messages?reportId=${reportId}`);
      if (msgs.length === lastLen) return;
      lastLen = msgs.length;
      body.innerHTML = msgs.map(m => {
        const mine = m.sender_id === state.user.id;
        return `<div class="bubble bubble--${mine ? 'me' : 'them'}">
          ${escapeHtml(m.content)}
          <span class="bubble__time">${new Date(m.created_at).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })}</span>
        </div>`;
      }).join('');
      body.scrollTop = body.scrollHeight;
    } catch {}
  }

  form.onsubmit = async (e) => {
    e.preventDefault();
    const input = document.getElementById('chatInput');
    const content = input.value.trim();
    if (!content) return;
    input.value = '';
    try {
      await api('/messages', { body: { reportId, content } });
      lastLen = -1;
      load();
    } catch (err) { toast(err.message, 'error'); }
  };

  load();
  setInterval(load, 3000);
}

/* =====================================================
   UTIL
   ===================================================== */
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

/* =====================================================
   INIT
   ===================================================== */
(async function init() {
  try {
    const data = await api('/auth?action=me');
    state.user = data.user;
  } catch { state.user = null; }

  if (!location.hash) {
    location.hash = state.user
      ? (state.user.role === 'ADMIN' ? '#/admin/reports' : '#/dashboard')
      : '#/login';
  }
  navigate();
})();
</script>
